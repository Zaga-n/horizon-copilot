default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
      - id: uv-lock
        name: Locked dependencies
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true
      - id: architecture
        name: Import boundaries
        entry: uv run --locked lint-imports
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: Member types
        entry: scripts/mypy-members.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: tests
        name: Hermetic tests
        entry: uv run --locked pytest -m "not integration and not e2e and not live"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
